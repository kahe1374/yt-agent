name: Test AI image
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Get image
        run: |
          curl -L -m 120 -o img.jpg "https://image.pollinations.ai/prompt/macro%20photo%20of%20glowing%20microchip%20on%20circuit%20board%2C%20cinematic%2C%20blue%20light?width=1080&height=1920&nologo=true&seed=1"
          ls -la img.jpg
          file img.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: test-image
          path: img.jpg
