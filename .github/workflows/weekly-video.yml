name: Weekly Tech Recap

on:
  schedule:
    - cron: '0 14 * * 6'   # Saturday 14:00 UTC, after Friday's daily video is archived
  workflow_dispatch:

jobs:
  make-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Write script, narration and render
        id: make
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OUT_DIR: output_weekly
        run: python weekly.py

      - uses: actions/upload-artifact@v4
        if: steps.make.outputs.made == 'true'
        with:
          name: weekly-video
          path: output_weekly/video.mp4

      - name: Upload to YouTube
        if: steps.make.outputs.made == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OUT_DIR: output_weekly
          PRIVACY: public
        run: python upload.py
