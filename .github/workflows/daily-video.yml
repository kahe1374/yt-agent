name: Daily Tech Video

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter

      - name: Download caption fonts
        run: |
          mkdir -p fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in lilitaone/LilitaOne-Regular bangers/Bangers-Regular righteous/Righteous-Regular chewy/Chewy-Regular paytoneone/PaytoneOne-Regular; do
            curl -fsSL -m 30 -o "fonts/$(basename $f).ttf" "$B/$f.ttf" || echo "skip $f"
          done
          ls -la fonts

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Write script and narration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python main.py

      - name: Render video
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python video.py

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: public
        run: python upload.py
